name: Android build
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', 'index.html', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and add Android platform
        working-directory: android-app
        run: |
          bash build_web.sh
          npm install
          npx cap add android
          npx cap sync android
      - name: Sign test builds with the fixed test key (so updates install over old versions)
        working-directory: android-app
        run: |
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          sig="""
              signingConfigs {
                  debug {
                      storeFile file('../../test.keystore')
                      storePassword 'spendtest'
                      keyAlias 'spendtest'
                      keyPassword 'spendtest'
                  }
              }
          """
          s=s.replace("android {","android {"+sig,1)
          open(p,'w').write(s)
          PY
      - name: Build test APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - name: Publish to the fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk spendpattern.apk
          gh release delete latest-test --yes --cleanup-tag || true
          gh release create latest-test spendpattern.apk --prerelease --title "Latest test build" --notes "Test build of SpendPattern for Android. Built from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d\ %H:%M) UTC."
