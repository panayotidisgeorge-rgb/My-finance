name: Android build
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', 'index.html', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and add Android platform
        working-directory: android-app
        run: |
          bash build_web.sh
          npm install
          npx cap add android
          npx cap sync android
      - name: Diagnostics (plugin registration)
        working-directory: android-app
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json || true
          grep -rho "registerPlugin([^)]*)" node_modules/@aparajita/capacitor-biometric-auth/dist/esm/*.js | head -3 || true
          grep -rh "USE_BIOMETRIC" node_modules/@aparajita/capacitor-biometric-auth/android/src/main/AndroidManifest.xml || true
      - name: Use the SpendPattern icon
        working-directory: android-app
        run: |
          res=android/app/src/main/res
          for d in icons/mipmap-*; do cp "$d"/*.png "$res/$(basename $d)/"; done
          cp icons/ic_launcher_background.xml "$res/values/ic_launcher_background.xml"
      - name: Sign test builds with the fixed test key (so updates install over old versions)
        working-directory: android-app
        run: |
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          sig="""
              signingConfigs {
                  debug {
                      storeFile file('../../test.keystore')
                      storePassword 'spendtest'
                      keyAlias 'spendtest'
                      keyPassword 'spendtest'
                  }
              }
          """
          s=s.replace("android {","android {"+sig,1)
          open(p,'w').write(s)
          PY
      - name: Build test APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - name: Publish to the fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk spendpattern.apk
          gh release delete latest-test --yes --cleanup-tag || true
          gh release create latest-test spendpattern.apk --prerelease --title "Latest test build" --notes "Test build of SpendPattern for Android. Built from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d\ %H:%M) UTC."

      - name: Build signed Play release (AAB) with the upload key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android-app/android
          python3 - <<'PY'
          import re,os
          p='app/build.gradle'
          s=open(p).read()
          s=re.sub(r'versionCode \d+','versionCode '+os.environ['RUN_NO'],s,1)
          open(p,'w').write(s)
          PY
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PW" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KS_PW"
          cd ../..
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab spendpattern.aab
          gh release delete latest-release --yes --cleanup-tag || true
          gh release create latest-release spendpattern.aab --prerelease --title "Latest Play release build" --notes "Signed AAB for Google Play upload. Version code ${RUN_NO}, commit ${GITHUB_SHA::7}."
