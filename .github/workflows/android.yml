name: Android build
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', 'index.html', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and add Android platform
        working-directory: android-app
        run: |
          bash build_web.sh
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK (installable on a phone for testing)
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spendpattern-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
