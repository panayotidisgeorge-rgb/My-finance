ks.forEach((k,j)=>{const cx=j*g+g/2;let y=H-pb;['i','c','a'].forEach((f,q)=>{const hh=EXT.nwh[k][f]*sc;y-=hh;if(hh>0&&!LN)s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${hh}" fill="${cols[q]}" opacity=".85"/>`});s+=(LN?'':`<text transform="translate(${cx+3},${y-4}) rotate(-90)" font-size="10" fill="var(--tx)">${fk(tot(k))}</text>`)+`<text x="${cx}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${MN[k%100-1]}</text>`});

${S_.parts.map((p,i)=>`<div class="mf" style="margin:6px 0"><label>Category<select id="sc${i}">${cats.map(c=>`<option value="${esc(c)}" ${c==p.c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Amount<input type="text" inputmode="decimal" id="sa${i}" class="amt" placeholder="0.00" value="${esc(p.a)}"></label>${S_.parts.length>2?`<div class="w"><button class="chip" data-sh="rm${i}">Remove part</button></div>`:''}</div>`).join('')}
<div class="n" style="color:${Math.abs(sum-tot)<.01?'var(--good)':'var(--mut)'}">Parts: ${f2(sum)} of ${f2(tot)}${Math.abs(sum-tot)<.01?' ✓':' · remaining '+f2(tot-sum)}</div>${S_.msg?`<div class="tb" style="border-color:#e5484d"><span>${esc(S_.msg)}</span></div>`:''}
<div class="row"><button class="chip" data-sh="addp">＋ Add part</button><button class="chip" data-sh="rest">Put remainder in last part</button></div><div class="row" style="margin-top:8px"><button class="chip on" data-sh="save">Save split</button>${EXT.spl[tk(r)]?`<button class="chip" data-sh="unsplit">Remove split</button>`:''}</div></div>`},

if(ps.length<2){S_.msg='Use at least two parts with an amount.'}else if(Math.abs(sum-tot)>=.01){S_.msg='The parts add up to '+f2(sum)+' but the transaction is '+f2(tot)+'.'}else{const key=tk(r);EXT.spl[key]=ps;OV[key]='Split (see parts)';rebuildImp();persist();shClose();draw();return}shDraw()}}};

const TRD=[["Recurring payments (housing, insurance, utilities…) are marked fixed automatically. “Fixed ✓” on a category counts its full amount; open a category to choose single transactions – then only the selected ones count. Choices made for a single year apply to that year. Use the period buttons and the month filter at the top to change the period. Follows the “exclude” switches above and is saved with your preferences.",["Wiederkehrende Zahlungen (Wohnen, Versicherung, Nebenkosten …) werden automatisch als fix markiert. «Fix ✓» bei einer Kategorie zählt den vollen Betrag; öffnen Sie eine Kategorie, um einzelne Transaktionen zu wählen – dann zählen nur die gewählten. Entscheidungen für ein einzelnes Jahr gelten für dieses Jahr. Mit den Zeitraum-Schaltflächen und dem Monatsfilter oben ändern Sie den Zeitraum. Folgt den «Ausschluss»-Schaltern oben und wird mit Ihren Einstellungen gesichert.","Les paiements récurrents (logement, assurances, charges…) sont marqués fixes automatiquement. « Fixe ✓ » sur une catégorie compte son montant complet ; ouvrez une catégorie pour choisir des transactions individuelles – seules les sélectionnées comptent. Les choix faits pour une année s'appliquent à cette année. Utilisez les boutons de période et le filtre de mois en haut pour changer la période. Suit les interrupteurs « exclure » ci-dessus et est enregistré avec vos préférences.","I pagamenti ricorrenti (abitazione, assicurazioni, utenze…) sono segnati come fissi automaticamente. «Fisso ✓» su una categoria conta il suo importo intero; apri una categoria per scegliere singole transazioni – allora contano solo quelle selezionate. Le scelte fatte per un singolo anno valgono per quell'anno. Usa i pulsanti del periodo e il filtro mese in alto per cambiare il periodo. Segue gli interruttori «escludi» sopra e viene salvato con le tue preferenze.","Los pagos recurrentes (vivienda, seguros, suministros…) se marcan como fijos automáticamente. «Fijo ✓» en una categoría cuenta su importe completo; abre una categoría para elegir transacciones sueltas – entonces solo cuentan las seleccionadas. Las decisiones para un solo año valen para ese año. Usa los botones de periodo y el filtro de mes de arriba para cambiar el periodo. Sigue los interruptores «excluir» de arriba y se guarda con tus preferencias.","Os pagamentos recorrentes (habitação, seguros, serviços…) são marcados como fixos automaticamente. «Fixo ✓» numa categoria conta o seu valor total; abra uma categoria para escolher transações individuais – então só contam as selecionadas. As escolhas feitas para um só ano valem para esse ano. Use os botões de período e o filtro de mês no topo para mudar o período. Segue os interruptores «excluir» acima e é guardado com as suas preferências.","Οι επαναλαμβανόμενες πληρωμές (στέγαση, ασφάλειες, κοινόχρηστα…) σημαίνονται αυτόματα ως πάγιες. Το «Πάγιο ✓» σε μια κατηγορία μετράει ολόκληρο το ποσό· ανοίξτε μια κατηγορία για να επιλέξετε μεμονωμένες συναλλαγές – τότε μετράνε μόνο οι επιλεγμένες. Οι επιλογές για ένα έτος ισχύουν για εκείνο το έτος. Χρησιμοποιήστε τα κουμπιά περιόδου και το φίλτρο μήνα πάνω για να αλλάξετε την περίοδο. Ακολουθεί τους διακόπτες «εξαίρεσης» και αποθηκεύεται με τις προτιμήσεις σας."]],["Export from your bank as CSV, Excel, PDF, OFX, QIF, MT940 or CAMT XML. The app finds the date, amount and text columns by itself; if it cannot, you get a quick column check. Only new transactions are added; ones already in the app are skipped.",["Exportieren Sie bei Ihrer Bank als CSV, Excel, PDF, OFX, QIF, MT940 oder CAMT-XML. Die App erkennt Datum-, Betrags- und Textspalten selbst; falls nicht, folgt eine kurze Spaltenprüfung. Es werden nur neue Transaktionen hinzugefügt.","Exportez depuis votre banque en CSV, Excel, PDF, OFX, QIF, MT940 ou CAMT XML. L'app trouve seule les colonnes date, montant et texte ; sinon, une vérification rapide des colonnes s'affiche. Seules les nouvelles transactions sont ajoutées.","Esporta dalla tua banca in CSV, Excel, PDF, OFX, QIF, MT940 o CAMT XML. L'app trova da sola le colonne data, importo e testo; altrimenti compare un rapido controllo delle colonne. Vengono aggiunte solo le nuove transazioni.","Exporta desde tu banco como CSV, Excel, PDF, OFX, QIF, MT940 o CAMT XML. La app encuentra sola las columnas de fecha, importe y texto; si no puede, aparece una comprobación rápida de columnas. Solo se añaden las transacciones nuevas.","Exporte do seu banco como CSV, Excel, PDF, OFX, QIF, MT940 ou CAMT XML. A app encontra sozinha as colunas de data, valor e texto; se não conseguir, aparece uma verificação rápida das colunas. Só são adicionadas transações novas.","Εξαγωγή από την τράπεζά σας ως CSV, Excel, PDF, OFX, QIF, MT940 ή CAMT XML. Η εφαρμογή βρίσκει μόνη της τις στήλες ημερομηνίας, ποσού και κειμένου· αλλιώς εμφανίζεται γρήγορος έλεγχος στηλών. Προστίθενται μόνο νέες συναλλαγές."]],["No statement file? Download the template, fill in date, counterparty, description and amount (expenses negative, income positive) plus an optional category, then upload it under 1 above. The app reads it and sorts everything automatically.",["Keine Kontoauszugsdatei? Laden Sie die Vorlage herunter, tragen Sie Datum, Empfänger, Beschreibung und Betrag ein (Ausgaben negativ, Einnahmen positiv) sowie optional eine Kategorie und laden Sie sie unter 1 oben hoch. Die App liest sie und ordnet alles automatisch zu.","Pas de relevé ? Téléchargez le modèle, renseignez la date, le bénéficiaire, la description et le montant (dépenses négatives, revenus positifs) ainsi qu’une catégorie facultative, puis importez-le sous 1 ci-dessus. L’application le lit et classe tout automatiquement.","Nessun estratto conto? Scarica il modello, inserisci data, beneficiario, descrizione e importo (spese negative, entrate positive) più una categoria facoltativa, poi caricalo al punto 1 qui sopra. L’app lo legge e ordina tutto automaticamente.","¿Sin extracto bancario? Descarga la plantilla, rellena fecha, beneficiario, descripción e importe (gastos negativos, ingresos positivos) y una categoría opcional, y súbela en el punto 1 de arriba. La app la lee y lo clasifica todo automáticamente.","Sem extrato? Descarregue o modelo, preencha data, beneficiário, descrição e montante (despesas negativas, receitas positivas) e uma categoria opcional, e carregue-o no ponto 1 acima. A app lê-o e classifica tudo automaticamente.","Δεν έχετε αρχείο κινήσεων; Κατεβάστε το πρότυπο, συμπληρώστε ημερομηνία, δικαιούχο, περιγραφή και ποσό (έξοδα αρνητικά, έσοδα θετικά) και προαιρετικά κατηγορία, και ανεβάστε το στο βήμα 1 παραπάνω. Η εφαρμογή το διαβάζει και τα ταξινομεί όλα αυτόματα."]],["Optional, can be uploaded separately. A card file that lists the purchases behind the monthly card bills splits those bills into purchases; other card statements work like a normal statement.",["Optional, kann separat hochgeladen werden. Eine Kartendatei mit den Einkäufen hinter den monatlichen Kartenrechnungen teilt diese Rechnungen in Einkäufe auf; andere Kartenabrechnungen funktionieren wie ein normaler Kontoauszug.","Facultatif, peut être importé séparément. Un fichier de carte listant les achats derrière les factures mensuelles répartit ces factures en achats ; les autres relevés de carte fonctionnent comme un relevé normal.","Facoltativo, può essere caricato separatamente. Un file carta con gli acquisti dietro gli estratti mensili suddivide quegli estratti in acquisti; gli altri estratti carta funzionano come un normale estratto conto.","Opcional, se puede subir por separado. Un archivo de tarjeta con las compras detrás de los recibos mensuales divide esos recibos en compras; otros extractos de tarjeta funcionan como un extracto normal.","Opcional, pode ser carregado separadamente. Um ficheiro de cartão com as compras por trás das faturas mensais divide essas faturas em compras; outros extratos de cartão funcionam como um extrato normal.","Προαιρετικό, μπορεί να ανεβεί χωριστά. Ένα αρχείο κάρτας με τις αγορές πίσω από τους μηνιαίους λογαριασμούς τους αναλύει σε αγορές· άλλα εκκαθαριστικά κάρτας λειτουργούν όπως ένα κανονικό αντίγραφο κίνησης."]],["in the app: transactions, investments, budgets, categories and settings. Afterwards you can import your own files or enter costs by hand. Tip: ☰ →",["in der App: Transaktionen, Anlagen, Budgets, Kategorien und Einstellungen. Danach können Sie eigene Dateien importieren oder Kosten von Hand erfassen. Tipp: ☰ →","dans l'app : transactions, placements, budgets, catégories et réglages. Ensuite vous pouvez importer vos fichiers ou saisir des coûts à la main. Astuce : ☰ →","nell'app: transazioni, investimenti, budget, categorie e impostazioni. Poi puoi importare i tuoi file o inserire i costi a mano. Suggerimento: ☰ →","en la app: transacciones, inversiones, presupuestos, categorías y ajustes. Después puedes importar tus archivos o introducir gastos a mano. Consejo: ☰ →","na app: transações, investimentos, orçamentos, categorias e definições. Depois pode importar os seus ficheiros ou introduzir custos manualmente. Dica: ☰ →","στην εφαρμογή: συναλλαγές, επενδύσεις, προϋπολογισμούς, κατηγορίες και ρυθμίσεις. Μετά μπορείτε να εισαγάγετε δικά σας αρχεία ή να καταχωρίσετε έξοδα χειροκίνητα. Συμβουλή: ☰ →"]],["Follows the “exclude investments / family support” switches above. Budgets are monthly limits per category and are saved with your other changes.",["Folgt den Schaltern «Anlagen / Familienunterstützung ausschliessen» oben. Budgets sind monatliche Limits pro Kategorie und werden mit Ihren anderen Änderungen gesichert.","Suit les interrupteurs « exclure placements / soutien familial » ci-dessus. Les budgets sont des plafonds mensuels par catégorie, enregistrés avec vos autres modifications.","Segue gli interruttori «escludi investimenti / sostegno familiare» sopra. I budget sono limiti mensili per categoria e vengono salvati con le altre modifiche.","Sigue los interruptores «excluir inversiones / ayuda familiar» de arriba. Los presupuestos son límites mensuales por categoría y se guardan con tus otros cambios.","Segue os interruptores «excluir investimentos / apoio familiar» acima. Os orçamentos são limites mensais por categoria e são guardados com as suas outras alterações.","Ακολουθεί τους διακόπτες «εξαίρεση επενδύσεων / οικογενειακής στήριξης». Οι προϋπολογισμοί είναι μηνιαία όρια ανά κατηγορία και αποθηκεύονται με τις άλλες αλλαγές σας."]],["Changes the language of menus, buttons and headings. Category names you created yourself and your own transaction texts stay as they are.",["Ändert die Sprache von Menüs, Schaltflächen und Überschriften. Selbst erstellte Kategorien und Ihre Transaktionstexte bleiben unverändert.","Change la langue des menus, boutons et titres. Vos propres catégories et textes de transactions restent inchangés.","Cambia la lingua di menu, pulsanti e titoli. Le categorie create da te e i testi delle transazioni restano invariati.","Cambia el idioma de menús, botones y títulos. Tus categorías y textos de transacciones no cambian.","Altera o idioma de menus, botões e títulos. As suas categorias e textos de transações não mudam.","Αλλάζει τη γλώσσα μενού, κουμπιών και τίτλων. Οι δικές σας κατηγορίες και κείμενα παραμένουν."]],["Sets the year used for “Year to date”, the previous-year buttons and the yearly charts. The Fixed tab keeps calendar years.",["Legt das Jahr für «Laufendes Jahr», die Vorjahr-Schaltflächen und die Jahresdiagramme fest. Die Registerkarte Fix nutzt Kalenderjahre.","Définit l'année utilisée pour « Depuis le début de l'année », les boutons d'années précédentes et les graphiques annuels. L'onglet Fixes utilise l'année civile.","Imposta l'anno usato per «Da inizio anno», i pulsanti degli anni precedenti e i grafici annuali. La scheda Fissi usa l'anno solare.","Define el año usado para «Del año hasta hoy», los botones de años anteriores y los gráficos anuales. La pestaña Fijos usa años naturales.","Define o ano usado em «Desde o início do ano», nos botões de anos anteriores e nos gráficos anuais. O separador Fixos usa anos civis.","Ορίζει το έτος για «Από την αρχή του έτους», τα κουμπιά προηγούμενων ετών και τα ετήσια γραφήματα. Τα Πάγια χρησιμοποιούν ημερολογιακά έτη."]],["and load your bank statement (CSV, Excel, PDF, OFX…). You can add a credit-card file afterwards. Your data stays private.",["und laden Sie Ihren Kontoauszug (CSV, Excel, PDF, OFX…). Eine Kreditkartendatei können Sie danach hinzufügen. Ihre Daten bleiben privat.","et chargez votre relevé bancaire (CSV, Excel, PDF, OFX…). Vous pourrez ajouter un fichier de carte de crédit ensuite. Vos données restent privées.","e carica il tuo estratto conto (CSV, Excel, PDF, OFX…). Puoi aggiungere dopo un file della carta di credito. I tuoi dati restano privati.","y carga tu extracto bancario (CSV, Excel, PDF, OFX…). Después puedes añadir un archivo de tarjeta de crédito. Tus datos son privados.","e carregue o seu extrato bancário (CSV, Excel, PDF, OFX…). Depois pode adicionar um ficheiro do cartão de crédito. Os seus dados ficam privados.","και φορτώστε την κίνηση του λογαριασμού σας (CSV, Excel, PDF, OFX…). Μπορείτε να προσθέσετε αργότερα αρχείο πιστωτικής κάρτας. Τα δεδομένα σας παραμένουν ιδιωτικά."]],["The app could not match them to a category. Pick one: it applies to all payments from the same source, also future ones.",["Die App konnte sie keiner Kategorie zuordnen. Wählen Sie eine: Sie gilt für alle Zahlungen derselben Quelle, auch künftige.","L'app n'a pas pu leur attribuer de catégorie. Choisissez-en une : elle s'applique à tous les paiements de la même source, y compris futurs.","L'app non ha potuto assegnare una categoria. Scegline una: vale per tutti i pagamenti della stessa fonte, anche futuri.","La app no pudo asignarles categoría. Elige una: se aplica a todos los pagos de la misma fuente, también futuros.","A app não conseguiu atribuir categoria. Escolha uma: aplica-se a todos os pagamentos da mesma origem, também futuros.","Η εφαρμογή δεν μπόρεσε να τις κατηγοριοποιήσει. Επιλέξτε: ισχύει για όλες τις πληρωμές της ίδιας πηγής, και μελλοντικές."]],["The Excel reader could not be loaded (no internet connection?). Please try again online or save the file as CSV.",["Der Excel-Leser konnte nicht geladen werden (keine Internetverbindung?). Bitte versuchen Sie es online erneut oder speichern Sie die Datei als CSV.","Le lecteur Excel n’a pas pu être chargé (pas de connexion Internet ?). Réessayez en ligne ou enregistrez le fichier en CSV.","Non è stato possibile caricare il lettore Excel (nessuna connessione a Internet?). Riprova online o salva il file come CSV.","No se pudo cargar el lector de Excel (¿sin conexión a Internet?). Inténtalo de nuevo con conexión o guarda el archivo como CSV.","Não foi possível carregar o leitor de Excel (sem ligação à Internet?). Tente novamente online ou guarde o ficheiro como CSV.","Δεν φορτώθηκε το πρόγραμμα ανάγνωσης Excel (χωρίς σύνδεση στο διαδίκτυο;). Δοκιμάστε ξανά online ή αποθηκεύστε το αρχείο ως CSV."]],["have no category yet. Pick a category: it applies to all payments from the same source, also future ones.",["haben noch keine Kategorie. Wählen Sie eine Kategorie: Sie gilt für alle Zahlungen derselben Quelle, auch künftige.","n'ont pas encore de catégorie. Choisissez-en une : elle s'applique à tous les paiements de la même source, y compris futurs.","non hanno ancora una categoria. Scegline una: vale per tutti i pagamenti della stessa fonte, anche futuri.","aún no tienen categoría. Elige una: se aplica a todos los pagos de la misma fuente, también futuros.","ainda não têm categoria. Escolha uma: aplica-se a todos os pagamentos da mesma origem, também futuros.","δεν έχουν ακόμη κατηγορία. Επιλέξτε: ισχύει για όλες τις πληρωμές της ίδιας πηγής, και μελλοντικές."]],["Becomes the default for every month. Month-specific amounts you set for this category are replaced.",["Wird zum Standard für jeden Monat. Monatsspezifische Beträge dieser Kategorie werden ersetzt.","Devient la valeur par défaut pour chaque mois. Les montants propres à un mois pour cette catégorie sont remplacés.","Diventa il valore predefinito per ogni mese. Gli importi specifici per mese di questa categoria vengono sostituiti.","Pasa a ser el valor por defecto de cada mes. Los importes específicos de mes de esta categoría se sustituyen.","Torna-se o valor predefinido de cada mês. Os valores específicos de um mês desta categoria são substituídos.","Γίνεται η προεπιλογή για κάθε μήνα. Τα ποσά συγκεκριμένων μηνών αυτής της κατηγορίας αντικαθίστανται."]],["Name your accounts (up to 3). Use the dropdown at the top to look at one account or all together.",["Benennen Sie Ihre Konten (bis zu 3). Mit der Auswahl oben sehen Sie ein Konto oder alle zusammen.","Nommez vos comptes (jusqu'à 3). Utilisez la liste en haut pour voir un compte ou tous ensemble.","Dai un nome ai tuoi conti (fino a 3). Usa il menu in alto per vedere un conto o tutti insieme.","Nombra tus cuentas (hasta 3). Usa el desplegable de arriba para ver una cuenta o todas juntas.","Dê nome às suas contas (até 3). Use a lista no topo para ver uma conta ou todas juntas.","Ονομάστε τους λογαριασμούς σας (έως 3). Χρησιμοποιήστε τη λίστα πάνω για έναν λογαριασμό ή όλους μαζί."]],["Respects the period and the exclude switches above. Refunds (negative amounts) are not shown.",["Berücksichtigt den Zeitraum und die Ausschluss-Schalter oben. Rückerstattungen (negative Beträge) werden nicht angezeigt.","Tient compte de la période et des interrupteurs d'exclusion ci-dessus. Les remboursements (montants négatifs) ne sont pas affichés.","Rispetta il periodo e gli interruttori di esclusione sopra. I rimborsi (importi negativi) non sono mostrati.","Respeta el periodo y los interruptores de exclusión de arriba. No se muestran los reembolsos (importes negativos).","Respeita o período e os interruptores de exclusão acima. Os reembolsos (valores negativos) não são mostrados.","Ακολουθεί την περίοδο και τους διακόπτες εξαίρεσης. Οι επιστροφές (αρνητικά ποσά) δεν εμφανίζονται."]],["Found automatically from repeating payments with similar amounts. Follows the switches above.",["Automatisch aus wiederholten Zahlungen mit ähnlichen Beträgen erkannt. Folgt den Schaltern oben.","Détectés automatiquement à partir de paiements répétés de montants similaires. Suit les interrupteurs ci-dessus.","Rilevati automaticamente da pagamenti ripetuti con importi simili. Segue gli interruttori sopra.","Detectados automáticamente a partir de pagos repetidos de importes similares. Sigue los interruptores de arriba.","Detetados automaticamente a partir de pagamentos repetidos de valores semelhantes. Segue os interruptores acima.","Εντοπίστηκαν αυτόματα από επαναλαμβανόμενες πληρωμές παρόμοιων ποσών."]],["Your positions are saved as a snapshot every month. The chart appears after the second month.",["Ihre Positionen werden jeden Monat als Momentaufnahme gespeichert. Das Diagramm erscheint nach dem zweiten Monat.","Vos positions sont enregistrées chaque mois. Le graphique apparaît après le deuxième mois.","Le tue posizioni vengono salvate ogni mese. Il grafico appare dopo il secondo mese.","Tus posiciones se guardan cada mes. El gráfico aparece tras el segundo mes.","As suas posições são guardadas todos os meses. O gráfico aparece após o segundo mês.","Οι θέσεις σας αποθηκεύονται κάθε μήνα. Το γράφημα εμφανίζεται μετά τον δεύτερο μήνα."]],["📄 PDF statements (e.g. from your banking app) work too – the app reads them automatically.",["📄 PDF-Kontoauszüge (z. B. aus der Banking-App) funktionieren ebenfalls – die App liest sie automatisch.","📄 Les relevés PDF (p. ex. de votre application bancaire) fonctionnent aussi : l'app les lit automatiquement.","📄 Funzionano anche gli estratti conto PDF (ad es. dall'app della banca): l'app li legge automaticamente.","📄 Los extractos en PDF (p. ej. de tu app bancaria) también funcionan: la app los lee automáticamente.","📄 Os extratos em PDF (p. ex. da app do banco) também funcionam: a app lê-os automaticamente.","📄 Οι κινήσεις λογαριασμού σε PDF (π.χ. από την εφαρμογή της τράπεζας) λειτουργούν επίσης – η εφαρμογή τις διαβάζει αυτόματα."]],["You are looking at made-up figures so you can try every tab. To start with your own data:",["Sie sehen erfundene Zahlen, damit Sie jede Registerkarte ausprobieren können. So starten Sie mit eigenen Daten:","Ce sont des chiffres fictifs pour essayer chaque onglet. Pour commencer avec vos données :","Sono cifre inventate per provare ogni scheda. Per iniziare con i tuoi dati:","Son cifras inventadas para probar cada pestaña. Para empezar con tus datos:","São valores fictícios para testar cada separador. Para começar com os seus dados:","Βλέπετε φανταστικά ποσά για να δοκιμάσετε κάθε καρτέλα. Για να ξεκινήσετε με τα δικά σας:"]],["Instead of a file, or in addition: add any cost or income yourself and pick its category.",["Statt einer Datei oder zusätzlich: Kosten oder Einnahmen selbst erfassen und Kategorie wählen.","Au lieu d'un fichier, ou en plus : ajoutez vous-même un coût ou un revenu et choisissez sa catégorie.","Al posto di un file, o in aggiunta: aggiungi tu un costo o un'entrata e scegli la categoria.","En lugar de un archivo, o además: añade tú un gasto o ingreso y elige su categoría.","Em vez de um ficheiro, ou além dele: adicione um custo ou receita e escolha a categoria.","Αντί για αρχείο, ή επιπλέον: προσθέστε έξοδο ή έσοδο και διαλέξτε κατηγορία."]],["The app currently shows made-up demo figures so you can try every function. This deletes",["Die App zeigt derzeit erfundene Demozahlen, damit Sie jede Funktion ausprobieren können. Das löscht","L'app affiche actuellement des chiffres de démo fictifs pour tout essayer. Cela supprime","L'app mostra al momento cifre demo inventate per provare ogni funzione. Questo elimina","La app muestra ahora cifras de demostración inventadas para probar cada función. Esto elimina","A app mostra atualmente valores de demonstração fictícios para testar cada função. Isto elimina","Η εφαρμογή δείχνει τώρα φανταστικά ποσά επίδειξης για να δοκιμάσετε κάθε λειτουργία. Αυτό διαγράφει"]],["transfer(s) between your accounts were detected and are not counted as income or costs.",["Übertrag/Überträge zwischen Ihren Konten erkannt und nicht als Einnahmen oder Kosten gezählt.","virement(s) entre vos comptes détecté(s) et non comptés comme revenus ou coûts.","trasferimento/i tra i tuoi conti rilevato/i e non conteggiato/i come entrate o costi.","transferencia(s) entre tus cuentas detectada(s) y no contada(s) como ingresos o gastos.","transferência(s) entre as suas contas detetada(s) e não contada(s) como receitas ou custos.","μεταφορά(ες) μεταξύ των λογαριασμών σας εντοπίστηκαν και δεν υπολογίζονται ως έσοδα ή έξοδα."]],["No transactions could be read with these settings. Check the date and amount columns.",["Mit diesen Einstellungen konnten keine Transaktionen gelesen werden. Prüfen Sie die Datums- und Betragsspalten.","Aucune transaction lisible avec ces réglages. Vérifiez les colonnes date et montant.","Nessuna transazione leggibile con queste impostazioni. Controlla le colonne data e importo.","No se pudo leer ninguna transacción con estos ajustes. Revisa las columnas de fecha e importe.","Não foi possível ler transações com estas definições. Verifique as colunas de data e valor.","Δεν διαβάστηκαν συναλλαγές με αυτές τις ρυθμίσεις. Ελέγξτε τις στήλες ημερομηνίας και ποσού."]],["This does not look like a bank statement: no columns found (date, text, amount).",["Das sieht nicht nach einem Kontoauszug aus: Es wurden keine Spalten (Datum, Text, Betrag) gefunden.","Cela ne ressemble pas à un relevé bancaire : aucune colonne (date, libellé, montant) trouvée.","Non sembra un estratto conto: nessuna colonna (data, testo, importo) trovata.","No parece un extracto bancario: no se encontraron columnas (fecha, texto, importe).","Não parece um extrato bancário: não foram encontradas colunas (data, texto, valor).","Δεν μοιάζει με κίνηση λογαριασμού: δεν βρέθηκαν στήλες (ημερομηνία, κείμενο, ποσό)."]],["Looks wrong? Undo this import, switch on “Check columns first” and import again.",["Sieht falsch aus? Import rückgängig machen, «Spalten zuerst prüfen» einschalten und erneut importieren.","Ça semble faux ? Annulez cet import, activez « Vérifier les colonnes d'abord » et réimportez.","Sembra sbagliato? Annulla questa importazione, attiva «Controlla prima le colonne» e importa di nuovo.","¿Parece incorrecto? Deshaz esta importación, activa «Comprobar columnas primero» e importa de nuevo.","Parece errado? Anule esta importação, ative «Verificar colunas primeiro» e importe de novo.","Φαίνεται λάθος; Αναιρέστε την εισαγωγή, ενεργοποιήστε «Έλεγχος στηλών πρώτα» και εισαγάγετε ξανά."]],["The app could not match these to a category. Tap to choose one for each source.",["Die App konnte diese keiner Kategorie zuordnen. Antippen und pro Quelle eine wählen.","L'app n'a pas pu leur attribuer de catégorie. Touchez pour en choisir une par source.","L'app non ha potuto assegnare una categoria. Tocca per sceglierne una per fonte.","La app no pudo asignarles categoría. Toca para elegir una por fuente.","A app não conseguiu atribuir categoria. Toque para escolher uma por origem.","Η εφαρμογή δεν μπόρεσε να τις κατηγοριοποιήσει. Πατήστε για επιλογή ανά πηγή."]],["Set up a screen lock (PIN, pattern or fingerprint) on your phone first.",["Richten Sie zuerst eine Bildschirmsperre (PIN, Muster oder Fingerabdruck) auf Ihrem Telefon ein.","Configurez d’abord un verrouillage d’écran (PIN, schéma ou empreinte) sur votre téléphone.","Imposta prima un blocco schermo (PIN, sequenza o impronta) sul telefono.","Configura primero un bloqueo de pantalla (PIN, patrón o huella) en tu teléfono.","Configure primeiro um bloqueio de ecrã (PIN, padrão ou impressão digital) no telemóvel.","Ρυθμίστε πρώτα κλείδωμα οθόνης (PIN, μοτίβο ή δακτυλικό αποτύπωμα) στο τηλέφωνό σας."]],["The current year is compared with the same months of the previous year.",["Das laufende Jahr wird mit denselben Monaten des Vorjahres verglichen.","L'année en cours est comparée aux mêmes mois de l'année précédente.","L'anno in corso è confrontato con gli stessi mesi dell'anno precedente.","El año actual se compara con los mismos meses del año anterior.","O ano atual é comparado com os mesmos meses do ano anterior.","Το τρέχον έτος συγκρίνεται με τους ίδιους μήνες του προηγούμενου."]],["Made-up figures so you can try every tab. To start with your own data:",["Erfundene Zahlen zum Ausprobieren aller Registerkarten. So starten Sie mit eigenen Daten:","Chiffres fictifs pour essayer chaque onglet. Pour commencer avec vos données :","Cifre inventate per provare ogni scheda. Per iniziare con i tuoi dati:","Cifras inventadas para probar cada pestaña. Para empezar con tus datos:","Valores fictícios para testar cada separador. Para começar com os seus dados:","Φανταστικά ποσά για να δοκιμάσετε κάθε καρτέλα. Για να ξεκινήσετε με τα δικά σας:"]],["Preferences loaded. (☰ → Undo last replace brings back what you had.)",["Einstellungen geladen. (☰ → Letzten Austausch rückgängig stellt den vorherigen Stand wieder her.)","Préférences chargées. (☰ → Annuler le dernier remplacement rétablit l’état précédent.)","Preferenze caricate. (☰ → Annulla ultima sostituzione ripristina lo stato precedente.)","Preferencias cargadas. (☰ → Deshacer el último reemplazo recupera el estado anterior.)","Preferências carregadas. (☰ → Anular a última substituição repõe o estado anterior.)","Οι προτιμήσεις φορτώθηκαν. (☰ → Αναίρεση τελευταίας αντικατάστασης επαναφέρει την προηγούμενη κατάσταση.)"]],["Divide the amount over several categories. The parts must add up to",["Betrag auf mehrere Kategorien aufteilen. Die Teile müssen zusammen ergeben:","Répartissez le montant sur plusieurs catégories. Les parts doivent totaliser :","Dividi l'importo su più categorie. Le parti devono sommare:","Divide el importe entre varias categorías. Las partes deben sumar:","Divida o valor por várias categorias. As partes têm de somar:","Μοιράστε το ποσό σε περισσότερες κατηγορίες. Τα μέρη πρέπει να αθροίζουν:"]],["payment/total line(s) of the card file ignored (not purchases)",["Zahlungs-/Summenzeile(n) der Kartendatei ignoriert (keine Einkäufe)","ligne(s) de paiement/total du fichier carte ignorée(s) (pas des achats)","riga/righe di pagamento/totale del file carta ignorata/e (non acquisti)","línea(s) de pago/total del archivo de tarjeta ignorada(s) (no son compras)","linha(s) de pagamento/total do ficheiro do cartão ignorada(s) (não são compras)","γραμμή/ές πληρωμής/συνόλου του αρχείου κάρτας αγνοήθηκαν (δεν είναι αγορές)"]],["Expense categories · tap a category to select its transactions",["Ausgabenkategorien · Kategorie antippen, um ihre Transaktionen zu wählen","Catégories de dépenses · touchez une catégorie pour choisir ses transactions","Categorie di spesa · tocca una categoria per selezionarne le transazioni","Categorías de gasto · toca una categoría para elegir sus transacciones","Categorias de despesa · toque numa categoria para escolher as transações","Κατηγορίες εξόδων · πατήστε μια κατηγορία"]],["credit-card bill(s) (lump sums, replaced by the card details)",["Kreditkartenabrechnung(en) (Sammelbeträge, durch die Kartendetails ersetzt)","facture(s) de carte de crédit (montants globaux, remplacés par le détail de la carte)","estratto/i carta di credito (importi cumulativi, sostituiti dai dettagli della carta)","factura(s) de tarjeta de crédito (importes globales, sustituidos por el detalle de la tarjeta)","fatura(s) do cartão de crédito (montantes globais, substituídos pelo detalhe do cartão)","λογαριασμός/οί πιστωτικής κάρτας (συνολικά ποσά, αντικαθίστανται από τις λεπτομέρειες της κάρτας)"]],["Your data lives only in this browser. Save a backup file now.",["Ihre Daten liegen nur in diesem Browser. Speichern Sie jetzt eine Sicherungsdatei.","Vos données ne sont que dans ce navigateur. Enregistrez un fichier de sauvegarde.","I tuoi dati sono solo in questo browser. Salva ora un file di backup.","Tus datos solo están en este navegador. Guarda un archivo de copia ahora.","Os seus dados estão apenas neste navegador. Guarde agora um ficheiro de cópia.","Τα δεδομένα σας υπάρχουν μόνο σε αυτό το πρόγραμμα περιήγησης. Αποθηκεύστε αντίγραφο τώρα."]],["Auto picks an icon from the name. Tap one to choose your own.",["Automatisch wählt die App ein Symbol anhand des Namens. Tippen Sie auf eines, um selbst zu wählen.","Auto choisit une icône d’après le nom. Touchez-en une pour choisir la vôtre.","Auto sceglie un’icona dal nome. Tocca un’icona per sceglierne una tua.","Auto elige un icono según el nombre. Toca uno para elegir el tuyo.","Auto escolhe um ícone pelo nome. Toque num para escolher o seu.","Το Αυτόματο επιλέγει εικονίδιο από το όνομα. Πατήστε ένα για να διαλέξετε δικό σας."]],["format detected automatically. Adjust if something is wrong.",["Format automatisch erkannt. Anpassen, falls etwas nicht stimmt.","format détecté automatiquement. Ajustez si quelque chose est faux.","formato rilevato automaticamente. Modifica se qualcosa non va.","formato detectado automáticamente. Ajusta si algo está mal.","formato detetado automaticamente. Ajuste se algo estiver errado.","η μορφή εντοπίστηκε αυτόματα. Προσαρμόστε αν κάτι δεν πάει καλά."]],[". The category is empty until you move transactions into it.",[". Die Kategorie ist leer, bis Sie Transaktionen hineinverschieben.",". La catégorie est vide tant que vous n'y déplacez pas de transactions.",". La categoria è vuota finché non ci sposti delle transazioni.",". La categoría está vacía hasta que muevas transacciones a ella.",". A categoria está vazia até mover transações para ela.",". Η κατηγορία είναι κενή μέχρι να μετακινήσετε συναλλαγές σε αυτήν."]],["They have no category yet. Tap to sort them in a few taps.",["Sie haben noch keine Kategorie. Tippen, um sie schnell einzuordnen.","Ils n'ont pas encore de catégorie. Touchez pour les classer rapidement.","Non hanno ancora una categoria. Tocca per classificarle in pochi tocchi.","Aún no tienen categoría. Toca para clasificarlas en pocos toques.","Ainda não têm categoria. Toque para os classificar rapidamente.","Δεν έχουν ακόμη κατηγορία. Πατήστε για γρήγορη ταξινόμηση."]],["Your category rules apply to imported data automatically.",["Ihre Kategorieregeln gelten automatisch für importierte Daten.","Vos règles de catégories s'appliquent automatiquement.","Le tue regole si applicano automaticamente ai dati importati.","Tus reglas de categoría se aplican automáticamente.","As suas regras aplicam-se automaticamente.","Οι κανόνες κατηγοριών εφαρμόζονται αυτόματα."]],["Use your fingerprint, face or phone PIN to open the app.",["Öffnen Sie die App mit Fingerabdruck, Gesicht oder der PIN Ihres Telefons.","Ouvrez l’app avec votre empreinte, votre visage ou le code PIN du téléphone.","Apri l’app con impronta, volto o PIN del telefono.","Abre la app con tu huella, tu cara o el PIN del teléfono.","Abra a app com a sua impressão digital, o rosto ou o PIN do telemóvel.","Ανοίξτε την εφαρμογή με δακτυλικό αποτύπωμα, πρόσωπο ή το PIN του τηλεφώνου."]],["Amounts are used as they are (no currency conversion).",["Beträge werden unverändert übernommen (keine Währungsumrechnung).","Les montants sont repris tels quels (pas de conversion de devise).","Gli importi sono usati così come sono (nessuna conversione di valuta).","Los importes se usan tal cual (sin conversión de divisa).","Os valores são usados como estão (sem conversão de moeda).","Τα ποσά χρησιμοποιούνται όπως είναι (χωρίς μετατροπή νομίσματος)."]],["with made-up demo numbers. Tip: back up first with ☰ →",["durch erfundene Demozahlen. Tipp: erst sichern mit ☰ →","par des chiffres de démo fictifs. Astuce : sauvegardez d’abord via ☰ →","con cifre demo inventate. Suggerimento: fai prima un backup con ☰ →","por cifras de demostración inventadas. Consejo: haz antes una copia con ☰ →","por valores de demonstração fictícios. Dica: faça antes uma cópia com ☰ →","με φανταστικά ποσά επίδειξης. Συμβουλή: κάντε πρώτα αντίγραφο με ☰ →"]],["Nothing to sort – every transaction has a category. 🎉",["Nichts einzuordnen – jede Transaktion hat eine Kategorie. 🎉","Rien à classer – chaque transaction a une catégorie. 🎉","Niente da classificare – ogni transazione ha una categoria. 🎉","Nada que clasificar – todas las transacciones tienen categoría. 🎉","Nada a classificar – todas as transações têm categoria. 🎉","Δεν υπάρχει κάτι – κάθε συναλλαγή έχει κατηγορία. 🎉"]],["Enter a cost or an income yourself – no file needed.",["Kosten oder Einnahmen selbst eingeben – keine Datei nötig.","Saisissez vous-même un coût ou un revenu – aucun fichier nécessaire.","Inserisci tu un costo o un'entrata – nessun file necessario.","Introduce tú un gasto o ingreso – sin archivo.","Introduza um custo ou receita – sem ficheiro.","Καταχωρίστε έξοδο ή έσοδο – χωρίς αρχείο."]],["The file only has a header row and no transactions.",["Die Datei enthält nur eine Kopfzeile und keine Transaktionen.","Le fichier ne contient qu’une ligne d’en-tête et aucune transaction.","Il file contiene solo una riga di intestazione e nessuna transazione.","El archivo solo tiene una fila de encabezado y ninguna transacción.","O ficheiro só tem uma linha de cabeçalho e nenhuma transação.","Το αρχείο έχει μόνο γραμμή κεφαλίδας και καμία συναλλαγή."]],["Total outflows per month · tap a bar for that month",["Gesamtausgaben pro Monat · Balken antippen für den Monat","Total des sorties par mois · touchez une barre pour ce mois","Uscite totali per mese · tocca una barra per quel mese","Gastos totales por mes · toca una barra para ese mes","Saídas totais por mês · toque numa barra para esse mês","Συνολικά έξοδα ανά μήνα · πατήστε μια μπάρα"]],["Profit / loss (investments & assets, cash excluded)",["Gewinn / Verlust (Anlagen & Sachwerte, ohne Bargeld)","Gain / perte (placements et biens, hors liquidités)","Utile / perdita (investimenti e beni, contanti esclusi)","Ganancia / pérdida (inversiones y bienes, si const FAQ={
en:[["Is my data safe? Where is it stored?","Your transactions are stored privately in your own account for this app. Statement files are read on your device, and nobody else, including the app's creator, can see your figures."],
["How do I import my bank statement?","Menu → Import data, then choose the file you downloaded from your e-banking (CSV, Excel, PDF, OFX, QIF, MT940 or CAMT XML). The app finds the columns by itself and tells you which ones it used. Use “Check columns first” if you want to control the mapping."],
["My bank is not listed – will it work?","Yes. The app is not tied to any bank. Export your statement from your online banking in any of the formats above and import it."],
["I imported the wrong file. How do I undo it?","Right after importing, tap Undo. Later you can use “Undo last replace” in the menu. Backups made with “Save preferences” can also be loaded again."],
["What does “Other (to review)” or “uncategorised” mean?","These are transactions the app could not recognise. The bell and the menu item “Uncategorised transactions” list them. Pick a category once and the app applies it to all transactions with the same counterparty."],
["How do I change a category?","Tap any transaction and choose a new category. You can apply it to this transaction only or to every transaction with the same counterparty and direction."],
["Why are some payments not counted as spending?","Investments and transfers between your own accounts are not everyday costs. The filters on the Overview hide them so the totals show your real living costs. Switch a filter off to include them."],
["What is the savings rate?","The part of your inflows you did not spend: (inflows − outflows) ÷ inflows. A higher value means you keep more of what you earn."],
["How do budgets and alerts work?","In the Budgets tab set a monthly limit per category. The app warns you in the bell and on the Overview when you are on track to exceed it this month."],
["How does net worth over time work?","Each time you update your accounts or investments, the app stores a snapshot of your total. The chart grows from those snapshots; dates before you started cannot be rebuilt."],
["How do I back up my data or move to another device?","Menu → Save preferences creates a file with your data and settings. On the other device choose Load preferences. Export CSV and Export Excel report give you copies for other programs."],
["How do I change currency, number format, date format or language?","Menu → Settings for currency, number and date formats and the start of your fiscal year. Menu → Language for the language."]],
de:[["Sind meine Daten sicher? Wo werden sie gespeichert?","Ihre Transaktionen werden privat in Ihrem eigenen Konto für diese App gespeichert. Kontoauszüge werden auf Ihrem Gerät gelesen, und niemand sonst, auch nicht der Ersteller der App, kann Ihre Zahlen sehen."],
["Wie importiere ich meinen Kontoauszug?","Menü → Daten importieren, dann die Datei aus Ihrem E-Banking wählen (CSV, Excel, PDF, OFX, QIF, MT940 oder CAMT-XML). Die App erkennt die Spalten selbst und zeigt, welche sie verwendet hat. Mit „Spalten zuerst prüfen“ steuern Sie die Zuordnung selbst."],
["Meine Bank steht nicht in der Liste – funktioniert es trotzdem?","Ja. Die App ist an keine Bank gebunden. Exportieren Sie den Auszug aus Ihrem Online-Banking in einem der genannten Formate und importieren Sie ihn."],
["Ich habe die falsche Datei importiert. Wie mache ich das rückgängig?","Tippen Sie direkt nach dem Import auf Rückgängig. Später finden Sie „Letztes Ersetzen rückgängig“ im Menü. Mit „Einstellungen sichern“ erstellte Sicherungen können Sie ebenfalls wieder laden."],
["Was bedeutet „Andere (prüfen)“ oder „nicht kategorisiert“?","Das sind Transaktionen, die die App nicht erkennen konnte. Die Glocke und der Menüpunkt „Nicht kategorisierte Transaktionen“ listen sie auf. Wählen Sie einmal eine Kategorie, und die App wendet sie auf alle Transaktionen mit demselben Empfänger an."],
["Wie ändere ich eine Kategorie?","Tippen Sie auf eine Transaktion und wählen Sie eine neue Kategorie. Sie können sie nur für diese Transaktion oder für alle Transaktionen mit demselben Empfänger und derselben Richtung übernehmen."],
["Warum werden manche Zahlungen nicht als Ausgaben gezählt?","Geldanlagen und Überweisungen zwischen Ihren eigenen Konten sind keine alltäglichen Kosten. Die Filter in der Übersicht blenden sie aus, damit die Summen Ihre echten Lebenshaltungskosten zeigen. Schalten Sie einen Filter aus, um sie einzubeziehen."],
["Was ist die Sparquote?","Der Teil Ihrer Einnahmen, den Sie nicht ausgegeben haben: (Einnahmen − Ausgaben) ÷ Einnahmen. Ein höherer Wert bedeutet, dass Sie mehr von Ihrem Verdienst behalten."],
["Wie funktionieren Budgets und Warnungen?","Legen Sie im Tab Budgets ein Monatslimit pro Kategorie fest. Die App warnt Sie in der Glocke und in der Übersicht, wenn Sie dieses Limit im laufenden Monat voraussichtlich überschreiten."],
["Wie funktioniert das Vermögen im Zeitverlauf?","Bei jeder Aktualisierung Ihrer Konten oder Anlagen speichert die App eine Momentaufnahme Ihres Gesamtbetrags. Das Diagramm wächst aus diesen Momentaufnahmen; Zeitpunkte vor Ihrem Start lassen sich nicht rekonstruieren."],
["Wie sichere ich meine Daten oder wechsle auf ein anderes Gerät?","Menü → Einstellungen sichern erstellt eine Datei mit Ihren Daten und Einstellungen. Auf dem anderen Gerät wählen Sie „Einstellungen laden“. CSV-Export und Excel-Bericht liefern Kopien für andere Programme."],
["Wie ändere ich Währung, Zahlen- und Datumsformat oder Sprache?","Menü → Einstellungen für Währung, Zahlen- und Datumsformat sowie den Beginn Ihres Geschäftsjahrs. Menü → Sprache für die Sprache."]],
fr:[["Mes données sont-elles en sécurité ? Où sont-elles stockées ?","Vos transactions sont stockées de façon privée dans votre propre compte pour cette application. Les relevés sont lus sur votre appareil, et personne d'autre, pas même le créateur de l'application, ne peut voir vos chiffres."],
["Comment importer mon relevé bancaire ?","Menu → Importer des données, puis choisissez le fichier téléchargé depuis votre e-banking (CSV, Excel, PDF, OFX, QIF, MT940 ou CAMT XML). L'application détecte les colonnes elle-même et indique lesquelles elle a utilisées. Utilisez « Vérifier les colonnes d'abord » pour contrôler l'association."],
["Ma banque n'est pas listée – cela fonctionnera-t-il ?","Oui. L'application n'est liée à aucune banque. Exportez votre relevé depuis votre banque en ligne dans l'un des formats ci-dessus et importez-le."],
["J'ai importé le mauvais fichier. Comment annuler ?","Juste après l'import, appuyez sur Annuler. Plus tard, utilisez « Annuler le dernier remplacement » dans le menu. Les sauvegardes faites avec « Enregistrer les préférences » peuvent aussi être rechargées."],
["Que signifie « Autre (à vérifier) » ou « non catégorisé » ?","Ce sont des transactions que l'application n'a pas pu reconnaître. La cloche et l'entrée de menu « Transactions non catégorisées » les listent. Choisissez une catégorie une fois et elle sera appliquée à toutes les transactions du même bénéficiaire."],
["Comment changer une catégorie ?","Appuyez sur une transaction et choisissez une nouvelle catégorie. Vous pouvez l'appliquer à cette seule transaction ou à toutes celles du même bénéficiaire et du même sens."],
["Pourquoi certains paiements ne sont-ils pas comptés comme dépenses ?","Les investissements et les virements entre vos propres comptes ne sont pas des dépenses courantes. Les filtres de l'aperçu les masquent pour que les totaux reflètent vos vrais frais de vie. Désactivez un filtre pour les inclure."],
["Qu'est-ce que le taux d'épargne ?","La part de vos entrées que vous n'avez pas dépensée : (entrées − sorties) ÷ entrées. Plus la valeur est haute, plus vous gardez de ce que vous gagnez."],
["Comment fonctionnent les budgets et les alertes ?","Dans l'onglet Budgets, fixez une limite mensuelle par catégorie. L'application vous avertit dans la cloche et dans l'aperçu lorsque vous risquez de la dépasser ce mois-ci."],
["Comment fonctionne la fortune nette dans le temps ?","À chaque mise à jour de vos comptes ou placements, l'application enregistre un instantané de votre total. Le graphique se construit à partir de ces instantanés ; les dates antérieures à votre début ne peuvent pas être reconstituées."],
["Comment sauvegarder mes données ou changer d'appareil ?","Menu → Enregistrer les préférences crée un fichier avec vos données et réglages. Sur l'autre appareil, choisissez Charger les préférences. L'export CSV et le rapport Excel fournissent des copies pour d'autres programmes."],
["Comment changer la devise, le format des nombres ou des dates, ou la langue ?","Menu → Réglages pour la devise, les formats de nombre et de date et le début de l'exercice. Menu → Langue pour la langue."]],
it:[["I miei dati sono al sicuro? Dove vengono salvati?","Le tue transazioni sono salvate in modo privato nel tuo account per questa app. Gli estratti conto vengono letti sul tuo dispositivo e nessun altro, nemmeno il creatore dell'app, può vedere le tue cifre."],
["Come importo il mio estratto conto?","Menu → Importa dati, poi scegli il file scaricato dal tuo e-banking (CSV, Excel, PDF, OFX, QIF, MT940 o CAMT XML). L'app trova da sola le colonne e ti dice quali ha usato. Usa «Controlla prima le colonne» per gestire l'assegnazione."],
["La mia banca non è nell'elenco: funzionerà?","Sì. L'app non è legata a nessuna banca. Esporta l'estratto dal tuo home banking in uno dei formati indicati e importalo."],
["Ho importato il file sbagliato. Come annullo?","Subito dopo l'importazione tocca Annulla. In seguito puoi usare «Annulla ultima sostituzione» nel menu. Si possono ricaricare anche i backup creati con «Salva preferenze»."],
["Cosa significa «Altro (da verificare)» o «non categorizzato»?","Sono transazioni che l'app non ha saputo riconoscere. La campanella e la voce di menu «Transazioni non categorizzate» le elencano. Scegli una categoria una volta e l'app la applica a tutte le transazioni con la stessa controparte."],
["Come cambio una categoria?","Tocca una transazione e scegli una nuova categoria. Puoi applicarla solo a questa transazione o a tutte quelle con la stessa controparte e direzione."],
["Perché alcuni pagamenti non sono conteggiati come spese?","Investimenti e giroconti tra i tuoi conti non sono costi quotidiani. I filtri della panoramica li nascondono, così i totali mostrano i tuoi veri costi di vita. Disattiva un filtro per includerli."],
["Che cos'è il tasso di risparmio?","La parte delle tue entrate che non hai speso: (entrate − uscite) ÷ entrate. Un valore più alto significa che trattieni di più di ciò che guadagni."],
["Come funzionano budget e avvisi?","Nella scheda Budget imposta un limite mensile per categoria. L'app ti avvisa nella campanella e nella panoramica quando stai per superarlo nel mese in corso."],
["Come funziona il patrimonio nel tempo?","A ogni aggiornamento dei tuoi conti o investimenti l'app salva un'istantanea del totale. Il grafico cresce da queste istantanee; le date precedenti al tuo inizio non si possono ricostruire."],
["Come faccio il backup dei dati o passo a un altro dispositivo?","Menu → Salva preferenze crea un file con dati e impostazioni. Sull'altro dispositivo scegli Carica preferenze. Esporta CSV ed Esporta report Excel danno copie per altri programmi."],
["Come cambio valuta, formato numeri e date o lingua?","Menu → Impostazioni per valuta, formati di numeri e date e inizio dell'anno fiscale. Menu → Lingua per la lingua."]],
es:[["¿Están seguros mis datos? ¿Dónde se guardan?","Tus transacciones se guardan de forma privada en tu propia cuenta para esta app. Los extractos se leen en tu dispositivo y nadie más, ni siquiera el creador de la app, puede ver tus cifras."],
["¿Cómo importo mi extracto bancario?","Menú → Importar datos y elige el archivo descargado de tu banca online (CSV, Excel, PDF, OFX, QIF, MT940 o CAMT XML). La app detecta las columnas sola y te dice cuáles usó. Usa «Revisar columnas primero» si quieres controlar la asignación."],
["Mi banco no aparece en la lista, ¿funcionará?","Sí. La app no está ligada a ningún banco. Exporta el extracto desde tu banca online en uno de los formatos indicados e impórtalo."],
["Importé el archivo equivocado. ¿Cómo lo deshago?","Justo después de importar, toca Deshacer. Más tarde puedes usar «Deshacer último reemplazo» en el menú. También puedes volver a cargar las copias hechas con «Guardar preferencias»."],
["¿Qué significa «Otros (revisar)» o «sin categoría»?","Son transacciones que la app no pudo reconocer. La campana y la opción de menú «Transacciones sin categoría» las listan. Elige una categoría una vez y la app la aplica a todas las transacciones con la misma contraparte."],
["¿Cómo cambio una categoría?","Toca una transacción y elige una categoría nueva. Puedes aplicarla solo a esa transacción o a todas las que tengan la misma contraparte y dirección."],
["¿Por qué algunos pagos no cuentan como gasto?","Las inversiones y las transferencias entre tus propias cuentas no son gastos cotidianos. Los filtros del resumen las ocultan para que los totales muestren tu coste de vida real. Desactiva un filtro para incluirlas."],
["¿Qué es la tasa de ahorro?","La parte de tus ingresos que no gastaste: (ingresos − gastos) ÷ ingresos. Un valor más alto significa que conservas más de lo que ganas."],
["¿Cómo funcionan los presupuestos y las alertas?","En la pestaña Presupuestos fija un límite mensual por categoría. La app te avisa en la campana y en el resumen cuando vas camino de superarlo este mes."],
["¿Cómo funciona el patrimonio neto a lo largo del tiempo?","Cada vez que actualizas tus cuentas o inversiones, la app guarda una instantánea de tu total. El gráfico crece a partir de esas instantáneas; las fechas anteriores a tu inicio no se pueden reconstruir."],
["¿Cómo hago una copia de seguridad o cambio de dispositivo?","Menú → Guardar preferencias crea un archivo con tus datos y ajustes. En el otro dispositivo elige Cargar preferencias. Exportar CSV y el informe Excel dan copias para otros programas."],
["¿Cómo cambio la moneda, el formato de números y fechas o el idioma?","Menú → Ajustes para moneda, formatos de número y fecha e inicio del año fiscal. Menú → Idioma para el idioma."]],
pt:[["Os meus dados estão seguros? Onde são guardados?","As suas transações são guardadas de forma privada na sua própria conta para esta app. Os extratos são lidos no seu dispositivo e mais ninguém, nem mesmo o criador da app, pode ver os seus valores."],
["Como importo o meu extrato bancário?","Menu → Importar dados e escolha o ficheiro descarregado do seu homebanking (CSV, Excel, PDF, OFX, QIF, MT940 ou CAMT XML). A app deteta as colunas sozinha e diz quais usou. Use «Verificar colunas primeiro» se quiser controlar a atribuição."],
["O meu banco não está na lista – vai funcionar?","Sim. A app não está ligada a nenhum banco. Exporte o extrato do seu homebanking num dos formatos indicados e importe-o."],
["Importei o ficheiro errado. Como desfaço?","Logo após importar, toque em Anular. Mais tarde pode usar «Anular última substituição» no menu. Também pode voltar a carregar cópias feitas com «Guardar preferências»."],
["O que significa «Outro (a rever)» ou «sem categoria»?","São transações que a app não conseguiu reconhecer. O sino e a opção de menu «Transações sem categoria» listam-nas. Escolha uma categoria uma vez e a app aplica-a a todas as transações com a mesma contraparte."],
["Como altero uma categoria?","Toque numa transação e escolha uma nova categoria. Pode aplicá-la só a essa transação ou a todas com a mesma contraparte e direção."],
["Porque é que alguns pagamentos não contam como despesa?","Investimentos e transferências entre as suas próprias contas não são custos do dia a dia. Os filtros do resumo escondem-nos para que os totais mostrem o seu custo de vida real. Desative um filtro para os incluir."],
["O que é a taxa de poupança?","A parte das suas entradas que não gastou: (entradas − saídas) ÷ entradas. Um valor mais alto significa que fica com mais do que ganha."],
["Como funcionam os orçamentos e os alertas?","No separador Orçamentos defina um limite mensal por categoria. A app avisa-o no sino e no resumo quando está a caminho de o ultrapassar este mês."],
["Como funciona o património líquido ao longo do tempo?","Sempre que atualiza as suas contas ou investimentos, a app guarda um instantâneo do total. O gráfico cresce a partir desses instantâneos; datas anteriores ao seu início não podem ser reconstruídas."],
["Como faço cópia de segurança ou mudo de dispositivo?","Menu → Guardar preferências cria um ficheiro com os seus dados e definições. No outro dispositivo escolha Carregar preferências. Exportar CSV e o relatório Excel dão cópias para outros programas."],
["Como altero a moeda, o formato de números e datas ou o idioma?","Menu → Definições para moeda, formatos de número e data e início do ano fiscal. Menu → Idioma para o idioma."]],
el:[["Είναι ασφαλή τα δεδομένα μου; Πού αποθηκεύονται;","Οι συναλλαγές σας αποθηκεύονται ιδιωτικά στον δικό σας λογαριασμό για αυτή την εφαρμογή. Οι κινήσεις λογαριασμού διαβάζονται στη συσκευή σας και κανείς άλλος, ούτε ο δημιουργός της εφαρμογής, δεν βλέπει τα ποσά σας."],
["Πώς εισάγω την κίνηση του λογαριασμού μου;","Μενού → Εισαγωγή δεδομένων και επιλέξτε το αρχείο που κατεβάσατε από το e-banking (CSV, Excel, PDF, OFX, QIF, MT940 ή CAMT XML). Η εφαρμογή βρίσκει μόνη της τις στήλες και σας λέει ποιες χρησιμοποίησε. Χρησιμοποιήστε «Έλεγχος στηλών πρώτα» για να ελέγξετε την αντιστοίχιση."],
["Η τράπεζά μου δεν υπάρχει στη λίστα – θα λειτουργήσει;","Ναι. Η εφαρμογή δεν συνδέεται με καμία τράπεζα. Εξαγάγετε την κίνηση από το e-banking σε μία από τις παραπάνω μορφές και εισαγάγετέ την."],
["Εισήγαγα λάθος αρχείο. Πώς το αναιρώ;","Αμέσως μετά την εισαγωγή πατήστε Αναίρεση. Αργότερα μπορείτε να χρησιμοποιήσετε το «Αναίρεση τελευταίας αντικατάστασης» στο μενού. Μπορείτε επίσης να φορτώσετε ξανά αντίγραφα που έγιναν με «Αποθήκευση προτιμήσεων»."],
["Τι σημαίνει «Άλλο (έλεγχος)» ή «χωρίς κατηγορία»;","Είναι συναλλαγές που η εφαρμογή δεν αναγνώρισε. Το κουδούνι και η επιλογή μενού «Συναλλαγές χωρίς κατηγορία» τις εμφανίζουν. Επιλέξτε μία φορά κατηγορία και η εφαρμογή την εφαρμόζει σε όλες τις συναλλαγές με τον ίδιο αντισυμβαλλόμενο."],
["Πώς αλλάζω μια κατηγορία;","Πατήστε μια συναλλαγή και επιλέξτε νέα κατηγορία. Μπορείτε να την εφαρμόσετε μόνο σε αυτήν ή σε όλες με τον ίδιο αντισυμβαλλόμενο και κατεύθυνση."],
["Γιατί κάποιες πληρωμές δεν μετρούν ως έξοδα;","Οι επενδύσεις και οι μεταφορές μεταξύ των δικών σας λογαριασμών δεν είναι καθημερινά έξοδα. Τα φίλτρα της σύνοψης τις κρύβουν ώστε τα σύνολα να δείχνουν το πραγματικό κόστος διαβίωσης. Απενεργοποιήστε ένα φίλτρο για να τις συμπεριλάβετε."],
["Τι είναι το ποσοστό αποταμίευσης;","Το μέρος των εσόδων σας που δεν ξοδέψατε: (έσοδα − έξοδα) ÷ έσοδα. Μεγαλύτερη τιμή σημαίνει ότι κρατάτε περισσότερα από όσα κερδίζετε."],
["Πώς λειτουργούν οι προϋπολογισμοί και οι ειδοποιήσεις;","Στην καρτέλα Προϋπ. ορίστε μηνιαίο όριο ανά κατηγορία. Η εφαρμογή σας ειδοποιεί στο κουδούνι και στη σύνοψη όταν πρόκειται να το ξεπεράσετε αυτόν τον μήνα."],
["Πώς λειτουργεί η καθαρή περιουσία στον χρόνο;","Κάθε φορά που ενημερώνετε λογαριασμούς ή επενδύσεις, η εφαρμογή αποθηκεύει στιγμιότυπο του συνόλου. Το γράφημα χτίζεται από αυτά τα στιγμιότυπα· ημερομηνίες πριν από την έναρξή σας δεν μπορούν να ανακατασκευαστούν."],
["Πώς κάνω αντίγραφο ασφαλείας ή αλλάζω συσκευή;","Μενού → Αποθήκευση προτιμήσεων δημιουργεί αρχείο με τα δεδομένα και τις ρυθμίσεις σας. Στην άλλη συσκευή επιλέξτε Φόρτωση προτιμήσεων. Η εξαγωγή CSV και η αναφορά Excel δίνουν αντίγραφα για άλλα προγράμματα."],
["Πώς αλλάζω νόμισμα, μορφή αριθμών και ημερομηνιών ή γλώσσα;","Μενού → Ρυθμίσεις για νόμισμα, μορφές αριθμών και ημερομηνίας και έναρξη οικονομικού έτους. Μενού → Γλώσσα για τη γλώσσα."]]
};
const FAQX={en:["Can I import a PDF statement?","Yes. Many banking apps only offer PDF. Choose the PDF in Import data like any other file; the app reads the table, works out which amounts are expenses and income and imports it. It does not need to be a scan: PDFs with selectable text work, pictures of paper do not. If something looks wrong, tap Undo."],
de:["Kann ich einen PDF-Kontoauszug importieren?","Ja. Viele Banking-Apps bieten nur PDF an. Wählen Sie das PDF unter „Daten importieren“ wie jede andere Datei; die App liest die Tabelle, erkennt Ausgaben und Einnahmen und importiert sie. Es muss ein PDF mit markierbarem Text sein, Fotos von Papier funktionieren nicht. Wenn etwas falsch aussieht, tippen Sie auf „Rückgängig“."],
fr:["Puis-je importer un relevé PDF ?","Oui. De nombreuses applications bancaires ne proposent que le PDF. Choisissez le PDF dans Importer des données comme n'importe quel fichier ; l'app lit le tableau, distingue dépenses et revenus et l'importe. Le PDF doit contenir du texte sélectionnable, les photos de papier ne fonctionnent pas. En cas d'erreur, touchez Annuler."],
it:["Posso importare un estratto conto PDF?","Sì. Molte app bancarie offrono solo il PDF. Scegli il PDF in Importa dati come qualsiasi file; l'app legge la tabella, distingue spese ed entrate e la importa. Il PDF deve avere testo selezionabile, le foto di carta non funzionano. Se qualcosa non torna, tocca Annulla."],
es:["¿Puedo importar un extracto en PDF?","Sí. Muchas apps bancarias solo ofrecen PDF. Elige el PDF en Importar datos como cualquier archivo; la app lee la tabla, distingue gastos e ingresos y lo importa. Debe ser un PDF con texto seleccionable, las fotos de papel no funcionan. Si algo parece mal, toca Deshacer."],
pt:["Posso importar um extrato em PDF?","Sim. Muitas apps bancárias só oferecem PDF. Escolha o PDF em Importar dados como qualquer ficheiro; a app lê a tabela, distingue despesas e receitas e importa. Tem de ser um PDF com texto selecionável, fotografias de papel não funcionam. Se algo parecer errado, toque em Anular."],
el:["Μπορώ να εισαγάγω κίνηση λογαριασμού σε PDF;","Ναι. Πολλές εφαρμογές τραπεζών προσφέρουν μόνο PDF. Επιλέξτε το PDF στην Εισαγωγή δεδομένων όπως κάθε αρχείο· η εφαρμογή διαβάζει τον πίνακα, ξεχωρίζει έξοδα και έσοδα και τον εισάγει. Πρέπει το PDF να έχει επιλέξιμο κείμενο, οι φωτογραφίες χαρτιού δεν λειτουργούν. Αν κάτι φαίνεται λάθος, πατήστε Αναίρεση."]};

SHV.report={html(G){const R=RU();return`<div class="sheet"><div class="row" style="justify-content:space-between"><b>${esc(R.t)}</b><button class="chip" data-sh="close">${esc(R.cl)}</button></div><div class="n" style="font-size:14px;line-height:1.5;margin:6px 0 10px">${esc(R.w)}</div><div class="mf"><label class="w">${esc(R.ty)}<select id="rpk">${R.k.map((x,i)=>`<option value="${i}" ${+G.k==i?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="w">${esc(R.m)}<textarea id="rpm" rows="10" style="min-height:220px" placeholder="${esc(R.mp)}">${esc(G.m||'')}</textarea></label><label class="w">${esc(R.em)}<input id="rpe" type="email" inputmode="email" autocomplete="email" placeholder="${esc(R.emp)}" value="${esc(G.em||'')}"></label></div><label class="row" style="gap:8px;font-size:13px;color:var(--mut)"><input type="checkbox" id="rpi" ${G.i===false?'':'checked'} style="width:auto;margin:0"> ${esc(R.inf)}</label>${G.msg?`<div class="tb" style="border-color:#e5484d"><span>${esc(G.msg)}</span></div>`:''}<div class="row" style="flex-wrap:wrap"><button class="chip on" data-sh="send" style="font-weight:700">${esc(R.send)}</button><button class="chip" data-sh="mail">${esc(R.se)}</button><button class="chip" data-sh="gmail">${esc(R.gm)}</button><button class="chip" data-sh="copy">${esc(R.copy)}</button></div><div class="n">${REPORT_ENDPOINT?esc(R.n2):esc(R.n)+' <b><a href="mailto:'+REPORT_EMAIL+'" style="color:var(--ac)">'+REPORT_EMAIL+'</a></b>'}</div></div>`},
read(G){G.k=gval('rpk');G.m=gval('rpm');G.em=(gval('rpe')||'').trim();G.i=!!($('#rpi')||{}).checked},
act(a,t,G){const R=RU();if(!G.m.trim()){G.msg=R.e;shDraw();return}if(a!='copy'&&!G.em){G.msg=R.er;shDraw();return}if(G.em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(G.em)){G.msg=R.ee;shDraw();return}G.msg='';const txt=reportText(R);
if(a=='copy'){try{navigator.clipboard.writeText((REPORT_EMAIL?'To: '+REPORT_EMAIL+'\n':'')+txt).then(()=>toast(R.cp),()=>toast(txt))}catch(e){toast(txt)}return}
if(a=='gmail'){const gu='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(REPORT_EMAIL)+'&su='+encodeURIComponent('SpendPattern: '+R.k[+G.k||0])+'&body='+encodeURIComponent(txt);const gl=document.createElement('a');gl.href=gu;gl.target='_blank';gl.rel='noopener';document.body.appendChild(gl);gl.click();gl.remove();return}if(a=='send'&&REPORT_ENDPOINT){toast(R.sb);fetch(REPORT_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({subject:'SpendPattern: '+R.k[+G.k||0],email:G.em,message:txt,website:''})}).then(async r=>{let j=null;try{j=await r.json()}catch(x){}if(!r.ok)throw {d:'HTTP '+r.status+(j&&j.message?' – '+j.message:'')};if(!j||j.ok!==true)throw {d:(j&&j.error)||'not accepted'};toast(R.ok,1);G.m='';shClose()}).catch(e=>{G.msg=R.bad+' ['+((e&&e.d)||(e&&e.message)||'network')+']';shDraw()});return}if(a=='send'||a=='mail'){if(!REPORT_EMAIL){try{navigator.clipboard.writeText(txt)}catch(e){}toast(R.cp);return}const u='mailto:'+REPORT_EMAIL+'?subject='+encodeURIComponent('SpendPattern: '+R.k[+G.k||0])+'&body='+encodeURIComponent(txt);const l=document.createElement('a');l.href=u;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()}}};
const TOURL={
en:{skip:'Skip',back:'Back',next:'Next',go:'Get started',of:' of ',s:[
['Import your statements','Tap ☰ → Import data and pick the file from your online banking (CSV, Excel, PDF, OFX…). The app finds the columns by itself, and you can undo an import.'],
['Or use our template','In ☰ → Import data, download the Excel or CSV template. Fill in date, counterparty, description and amount (expenses negative, income positive), then upload it like a bank file.'],
['Remove the demo data','The app starts with made-up numbers. Before importing your own, tap ☰ → Remove demo data. You can load the demo again any time.'],
['Add categories and transactions','Tap +. New category creates your own; Add transaction enters a cost or income by hand.'],
['Fix wrong categories','Transactions the app can’t place appear under the bell and in ☰ → Uncategorised transactions. Tap one to change its category – for this payment only, or for all payments to the same counterparty, now and in future imports.'],
['Set a budget','In the Budgets tab, enter a monthly limit per category. The bell and Overview warn you when you get close or go over.'],
['Track your investments','In the Invest tab, tap + to add accounts, investments and savings goals. Update the values now and then: each update adds a point to your net worth chart.'],
['Save your preferences','Tap ☰ → Save preferences to keep all your manual changes in one file, so you never have to recategorise again: transactions, categories, corrections, budgets and goals. New phone or reinstalled app? Tap ☰ → Load preferences and pick the file.']]},
de:{skip:'Überspringen',back:'Zurück',next:'Weiter',go:'Los geht’s',of:' von ',s:[
['Kontoauszüge importieren','Tippen Sie auf ☰ → Daten importieren und wählen Sie die Datei aus Ihrem E-Banking (CSV, Excel, PDF, OFX…). Die App erkennt die Spalten selbst, und ein Import lässt sich rückgängig machen.'],
['Oder unsere Vorlage nutzen','Laden Sie unter ☰ → Daten importieren die Excel- oder CSV-Vorlage herunter. Tragen Sie Datum, Empfänger, Beschreibung und Betrag ein (Ausgaben negativ, Einnahmen positiv) und laden Sie sie wie eine Bankdatei hoch.'],
['Demodaten entfernen','Die App startet mit erfundenen Zahlen. Tippen Sie vor dem eigenen Import auf ☰ → Demodaten entfernen. Die Demodaten lassen sich jederzeit wieder laden.'],
['Kategorien und Transaktionen hinzufügen','Tippen Sie auf +. Mit Neue Kategorie erstellen Sie eine eigene, mit Transaktion erfassen tragen Sie eine Ausgabe oder Einnahme von Hand ein.'],
['Falsche Kategorien korrigieren','Was die App nicht zuordnen kann, erscheint unter der Glocke und in ☰ → Nicht kategorisierte Transaktionen. Tippen Sie darauf und ändern Sie die Kategorie – nur für diese Zahlung oder für alle Zahlungen an denselben Empfänger, auch bei künftigen Importen.'],
['Ein Budget festlegen','Geben Sie im Tab Budgets pro Kategorie ein Monatslimit ein. Die Glocke und die Übersicht warnen Sie, wenn Sie sich dem Limit nähern oder es überschreiten.'],
['Anlagen verfolgen','Tippen Sie im Tab Anlagen auf +, um Konten, Anlagen und Sparziele hinzuzufügen. Aktualisieren Sie die Werte ab und zu: Jede Aktualisierung fügt Ihrem Vermögensverlauf einen Punkt hinzu.'],
['Einstellungen sichern','Tippen Sie auf ☰ → Einstellungen sichern, um alle Ihre manuellen Änderungen in einer Datei zu behalten, damit Sie nie wieder neu kategorisieren müssen: Transaktionen, Kategorien, Korrekturen, Budgets und Ziele. Neues Handy oder App neu installiert? Tippen Sie auf ☰ → Einstellungen laden und wählen Sie die Datei.']]},
fr:{skip:'Passer',back:'Retour',next:'Suivant',go:'Commencer',of:' sur ',s:[
['Importer vos relevés','Touchez ☰ → Importer des données et choisissez le fichier de votre e-banking (CSV, Excel, PDF, OFX…). L’application trouve seule les colonnes, et vous pouvez annuler un import.'],
['Ou utilisez notre modèle','Dans ☰ → Importer des données, téléchargez le modèle Excel ou CSV. Renseignez la date, le bénéficiaire, la description et le montant (dépenses négatives, revenus positifs), puis importez-le comme un fichier bancaire.'],
['Supprimer les données de démo','L’application démarre avec des chiffres fictifs. Avant d’importer les vôtres, touchez ☰ → Supprimer les données de démo. Vous pourrez les recharger à tout moment.'],
['Ajouter des catégories et des transactions','Touchez +. Nouvelle catégorie crée la vôtre ; Ajouter une transaction saisit une dépense ou un revenu à la main.'],
['Corriger les mauvaises catégories','Ce que l’application ne sait pas classer apparaît sous la cloche et dans ☰ → Transactions non catégorisées. Touchez-le pour changer la catégorie – pour ce paiement seul ou pour tous les paiements au même bénéficiaire, y compris lors des prochains imports.'],
['Définir un budget','Dans l’onglet Budgets, saisissez une limite mensuelle par catégorie. La cloche et l’aperçu vous avertissent quand vous approchez d’une limite ou la dépassez.'],
['Suivre vos placements','Dans l’onglet Placements, touchez + pour ajouter des comptes, des placements et des objectifs d’épargne. Mettez les valeurs à jour de temps en temps : chaque mise à jour ajoute un point à votre courbe de fortune.'],
